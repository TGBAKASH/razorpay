services:
  - type: web
    name: dealflow-api
    runtime: node
    rootDir: services/api
    buildCommand: "npm install && npm run build"
    preDeployCommand: "npx prisma migrate deploy"
    startCommand: "npm start"
    healthCheckPath: "/api/healthz"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SIGNING_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: dealflow-dashboard
    runtime: node
    rootDir: apps/dashboard
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
